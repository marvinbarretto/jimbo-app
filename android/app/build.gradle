apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
apply plugin: 'org.jetbrains.kotlin.plugin.compose'
apply plugin: 'com.google.devtools.ksp'

def localProps = new Properties()
def localPropsFile = rootProject.file('local.properties')
if (localPropsFile.exists()) {
    localPropsFile.withInputStream { localProps.load(it) }
}

android {
    namespace = "dev.marvinbarretto.jimbo"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "dev.marvinbarretto.jimbo"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
        buildConfigField "String", "JIMBO_API_URL", "\"${localProps.getProperty('jimbo.api.url', '')}\""
        buildConfigField "String", "JIMBO_API_KEY", "\"${localProps.getProperty('jimbo.api.key', '')}\""
        buildConfigField "String", "JIMBO_DEVICE_ID", "\"${localProps.getProperty('jimbo.device.id', 'pixel-marvin')}\""
        // LocalShout screen-capture ingest. Blank by default: ScreenSyncWorker
        // no-ops when unset, so a build without these still runs — it just never
        // sends. Set localshout.ingest.url / localshout.screen.key to enable.
        buildConfigField "String", "LOCALSHOUT_INGEST_URL", "\"${localProps.getProperty('localshout.ingest.url', '')}\""
        buildConfigField "String", "LOCALSHOUT_SCREEN_KEY", "\"${localProps.getProperty('localshout.screen.key', '')}\""
    }
    buildFeatures {
        compose true
        buildConfig = true
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    kotlinOptions {
        jvmTarget = "21"
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

// Room writes the resolved schema to app/schemas/<db>/<version>.json at compile
// time. That file is the ground truth for what a migration's SQL must produce —
// hand-written CREATE TABLE that differs by so much as a nullability flag makes
// Room throw on open. Diff the exported JSON when adding a migration.
ksp {
    arg("room.schemaLocation", "$projectDir/schemas")
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')

    // Compose
    def composeBom = platform('androidx.compose:compose-bom:2025.04.01')
    implementation composeBom
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation "androidx.activity:activity-compose:$androidxActivityVersion"
    debugImplementation 'androidx.compose.ui:ui-tooling'

    // Jimbo telemetry stack (ported from legacy app/ module).
    implementation "androidx.core:core-ktx:1.17.0"
    implementation "androidx.health.connect:connect-client:1.1.0-alpha10"
    implementation "androidx.work:work-runtime-ktx:2.10.0"
    implementation "com.google.android.gms:play-services-location:21.3.0"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0"
    implementation "androidx.room:room-runtime:2.7.0-alpha12"
    implementation "androidx.room:room-ktx:2.7.0-alpha12"
    ksp "androidx.room:room-compiler:2.7.0-alpha12"
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
